<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTinder - airBaltic Roster Swap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AddPilotForm({ onAdd }) {
  const [formData, setFormData] = useState({
    trigram: '',
    name: '',
    rank: 'FO',
    base: 'TLL',
    ics_url: ''
  });

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!formData.trigram || !formData.ics_url) return;
    
    // Transmet les données au composant principal
    onAdd(formData);
    setFormData({ trigram: '', name: '', rank: 'FO', base: 'TLL', ics_url: '' });
  };

  return (
    <form onSubmit={handleSubmit} className="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-4 mb-8">
      <h2 className="text-lg font-bold text-lime-400">Ajouter mon Roster</h2>
      
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label className="block text-xs text-slate-400 mb-1">Trigramme (ex: WLH)</label>
          <input 
            type="text" 
            maxLength="3"
            value={formData.trigram}
            onChange={(e) => setFormData({...formData, trigram: e.target.value.toUpperCase()})}
            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 uppercase"
            placeholder="WLH"
            required
          />
        </div>

        <div>
          <label className="block text-xs text-slate-400 mb-1">Nom / Prénom</label>
          <input 
            type="text" 
            value={formData.name}
            onChange={(e) => setFormData({...formData, name: e.target.value})}
            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100"
            placeholder="Valère"
            required
          />
        </div>

        <div>
          <label className="block text-xs text-slate-400 mb-1">Fonction</label>
          <select 
            value={formData.rank}
            onChange={(e) => setFormData({...formData, rank: e.target.value})}
            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100"
          >
            <option value="FO">First Officer (FO)</option>
            <option value="CPT">Captain (CPT)</option>
          </select>
        </div>

        <div>
          <label className="block text-xs text-slate-400 mb-1">Base</label>
          <select 
            value={formData.base}
            onChange={(e) => setFormData({...formData, base: e.target.value})}
            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100"
          >
            <option value="TLL">Tallinn (TLL)</option>
            <option value="RIX">Riga (RIX)</option>
            <option value="VNO">Vilnius (VNO)</option>
            <option value="TAY">Tartu (TAY)</option>
          </select>
        </div>
      </div>

      <div>
        <label className="block text-xs text-slate-400 mb-1">Lien iCal (who.airbaltic.com)</label>
        <input 
          type="url" 
          value={formData.ics_url}
          onChange={(e) => setFormData({...formData, ics_url: e.target.value})}
          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-xs font-mono"
          placeholder="https://who.airbaltic.com/api/v1/roster/calendar/download/..."
          required
        />
      </div>

      <button 
        type="submit"
        className="w-full bg-lime-400 hover:bg-lime-500 text-slate-950 font-bold py-3 rounded-lg transition"
      >
        Enregistrer mon Roster
      </button>
    </form>
  );
}

    function App() {
      const [pilotsData, setPilotsData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [selectedPilot, setSelectedPilot] = useState(null);

      useEffect(() => {
        // Charger le fichier data.json généré par GitHub Actions
        fetch('./data.json')
          .then((res) => {
            if (!res.ok) throw new Error("Impossible de charger les données (data.json non trouvé).");
            return res.json();
          })
          .then((data) => {
            setPilotsData(data);
            if (data.length > 0) setSelectedPilot(data[0]);
            setLoading(false);
          })
          .catch((err) => {
            setError(err.message);
            setLoading(false);
          });
      }, []);

      const formatICSTime = (icsTimeStr) => {
        if (!icsTimeStr) return '';
        try {
          const year = icsTimeStr.substring(0, 4);
          const month = icsTimeStr.substring(4, 6);
          const day = icsTimeStr.substring(6, 8);
          const hour = icsTimeStr.substring(9, 11) || '00';
          const min = icsTimeStr.substring(11, 13) || '00';
          return `${day}/${month}/${year} à ${hour}:${min} UTC`;
        } catch (e) {
          return icsTimeStr;
        }
      };

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-screen text-slate-400">
            ✈️ Chargement des plannings en cours...
          </div>
        );
      }

      if (error) {
        return (
          <div className="max-w-xl mx-auto mt-20 p-6 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400">
            <h2 className="font-bold text-lg mb-2">Erreur de chargement</h2>
            <p className="text-sm">{error}</p>
          </div>
        );
      }

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-8">
          <header className="flex items-center justify-between border-b border-slate-700 pb-6 mb-8">
            <div>
              <h1 className="text-2xl font-bold text-lime-400">✈️ BTinder - airBaltic Swap</h1>
              <p className="text-slate-400 text-sm mt-1">Base de données des Roster & Assistant de Swap</p>
            </div>
            <div className="text-right">
              <span className="text-xs bg-slate-800 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-full">
                {pilotsData.length} pilote(s) enregistré(s)
              </span>
            </div>
          </header>

          <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
            {/* Liste des pilotes */}
            <div className="space-y-3">
              <h2 className="text-sm font-semibold text-slate-400 uppercase tracking-wider">Pilotes</h2>
              {pilotsData.map((pilot) => (
                <button
                  key={pilot.trigram}
                  onClick={() => setSelectedPilot(pilot)}
                  className={`w-full text-left p-4 rounded-xl border transition ${
                    selectedPilot?.trigram === pilot.trigram
                      ? 'bg-lime-400/10 border-lime-400/50 text-lime-400'
                      : 'bg-slate-800 border-slate-700 hover:border-slate-600 text-slate-200'
                  }`}
                >
                  <div className="font-bold font-mono text-lg">{pilot.trigram}</div>
                  <div className="text-xs text-slate-400 mt-1">{pilot.name} • {pilot.rank} ({pilot.base})</div>
                  <div className="text-[10px] text-slate-500 mt-2">
                    {pilot.events?.length || 0} activités
                  </div>
                </button>
              ))}
            </div>

            {/* Vue du planning du pilote sélectionné */}
            <div className="md:col-span-3 space-y-4">
              {selectedPilot && (
                <>
                  <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-bold text-slate-100">
                        Planning de <span className="text-lime-400">{selectedPilot.name} ({selectedPilot.trigram})</span>
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">
                        Dernière synchro : {new Date(selectedPilot.last_updated).toLocaleString('fr-FR')}
                      </p>
                    </div>
                  </div>

                  <div className="space-y-3">
                    <h3 className="text-sm font-semibold text-slate-400">Activités au planning :</h3>
                    {selectedPilot.events && selectedPilot.events.length > 0 ? (
                      selectedPilot.events.slice(0, 40).map((ev, idx) => (
                        <div key={idx} className="bg-slate-800 border border-slate-700 rounded-lg p-4 flex justify-between items-center hover:border-slate-600">
                          <div>
                            <div className="font-semibold text-lime-400 font-mono text-base">{ev.SUMMARY}</div>
                            <div className="text-xs text-slate-400 mt-1">
                              Début : {formatICSTime(ev.DTSTART)}
                            </div>
                          </div>
                          <button 
                            onClick={() => alert(`Proposer un swap pour ${ev.SUMMARY}`)}
                            className="text-xs bg-lime-400 hover:bg-lime-500 text-slate-950 font-bold px-4 py-2 rounded-lg transition"
                          >
                            Proposer un swap
                          </button>
                        </div>
                      ))
                    ) : (
                      <div className="text-slate-500 text-sm p-4">Aucun événement disponible.</div>
                    )}
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
