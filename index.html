<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>airBaltic Roster Swap & FTL Legal Checker</title>
  <!-- Tailwind CSS pour le style -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel pour interpréter le JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [icsUrl, setIcsUrl] = useState('');
      const [savedUrl, setSavedUrl] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [events, setEvents] = useState([]);
      const [trigram, setTrigram] = useState('');

      // Charger le lien sauvegardé au démarrage
      useEffect(() => {
        const storedUrl = localStorage.getItem('airbaltic_ics_url');
        if (storedUrl) {
          setIcsUrl(storedUrl);
          setSavedUrl(storedUrl);
          fetchCalendar(storedUrl);
        }
      }, []);

      // Parser basique du fichier iCal (.ics)
      const parseICS = (icsText) => {
        const parsedEvents = [];
        const lines = icsText.split(/\r\n|\n|\r/);
        let currentEvent = null;

        for (let line of lines) {
          if (line.startsWith('BEGIN:VEVENT')) {
            currentEvent = {};
          } else if (line.startsWith('END:VEVENT')) {
            if (currentEvent) {
              parsedEvents.push(currentEvent);
            }
            currentEvent = null;
          } else if (currentEvent) {
            if (line.startsWith('SUMMARY:')) {
              currentEvent.summary = line.substring(8);
            } else if (line.startsWith('DTSTART:')) {
              currentEvent.start = parseICSTime(line.substring(8));
            } else if (line.startsWith('DTEND:')) {
              currentEvent.end = parseICSTime(line.substring(6));
            } else if (line.startsWith('DESCRIPTION:')) {
              currentEvent.description = line.substring(12);
            }
          }
        }
        return parsedEvents;
      };

      // Helper conversion date iCal -> Objet Date
      const parseICSTime = (timeStr) => {
        const cleanStr = timeStr.split(':')[1] || timeStr;
        const year = parseInt(cleanStr.substring(0, 4));
        const month = parseInt(cleanStr.substring(4, 6)) - 1;
        const day = parseInt(cleanStr.substring(6, 8));
        const hour = parseInt(cleanStr.substring(9, 11)) || 0;
        const min = parseInt(cleanStr.substring(11, 13)) || 0;
        return new Date(Date.UTC(year, month, day, hour, min));
      };

      // Téléchargement via relais CORS
      const fetchCalendar = async (urlToFetch) => {
        setLoading(true);
        setError(null);

        // Extraction du trigramme si présent dans l'URL (ex: .../WLH/...)
        const matches = urlToFetch.match(/\/([A-Z]{3})\//);
        if (matches && matches[1]) {
          setTrigram(matches[1]);
        }

        try {
          // Relais CORS gratuit
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(urlToFetch)}`;
          const response = await fetch(proxyUrl);
          
          if (!response.ok) {
            throw new Error('Impossible de récupérer le calendrier. Vérifiez l\'URL.');
          }

          const icsData = await response.text();
          const parsed = parseICS(icsData);
          setEvents(parsed);
          
          // Sauvegarder l'URL valide dans le navigateur
          localStorage.setItem('airbaltic_ics_url', urlToFetch);
          setSavedUrl(urlToFetch);
        } catch (err) {
          setError(err.message || 'Erreur lors du téléchargement du planning.');
        } finally {
          setLoading(false);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (icsUrl) {
          fetchCalendar(icsUrl);
        }
      };

      const clearUrl = () => {
        localStorage.removeItem('airbaltic_ics_url');
        setSavedUrl('');
        setIcsUrl('');
        setEvents([]);
        setTrigram('');
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          {/* Header */}
          <header className="flex items-center justify-between border-b border-slate-700 pb-6 mb-8">
            <div>
              <h1 className="text-2xl font-bold text-lime-400 flex items-center gap-2">
                ✈️ airBaltic Swap Assistant
              </h1>
              <p className="text-slate-400 text-sm mt-1">
                Vérificateur de légalité FTL & Échange de plannings automatisé
              </p>
            </div>
            {trigram && (
              <span className="bg-lime-400/10 text-lime-400 border border-lime-400/30 px-3 py-1 rounded-full text-sm font-mono font-bold">
                Pilote : {trigram}
              </span>
            )}
          </header>

          {/* Formulaire d'importation / URL */}
          <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-8 shadow-lg">
            <h2 className="text-lg font-semibold mb-3 text-slate-200">
              1. Lien de synchronisation Roster (`who.airbaltic.com`)
            </h2>
            
            {!savedUrl ? (
              <form onSubmit={handleSubmit} className="flex flex-col gap-3">
                <input
                  type="url"
                  placeholder="https://who.airbaltic.com/api/v1/roster/calendar/download/FULL/..."
                  value={icsUrl}
                  onChange={(e) => setIcsUrl(e.target.value)}
                  required
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-lime-400 font-mono text-slate-200"
                />
                <button
                  type="submit"
                  disabled={loading}
                  className="bg-lime-400 hover:bg-lime-500 text-slate-950 font-semibold px-6 py-3 rounded-lg transition text-sm flex items-center justify-center gap-2"
                >
                  {loading ? 'Chargement du planning...' : 'Synchroniser mon planning'}
                </button>
              </form>
            ) : (
              <div className="flex items-center justify-between bg-slate-900 border border-slate-700 rounded-lg p-4">
                <div className="flex items-center gap-3 overflow-hidden">
                  <span className="text-lime-400 font-bold text-xs bg-lime-400/10 border border-lime-400/20 px-2 py-1 rounded">
                    SYNCHRONISÉ
                  </span>
                  <p className="text-xs font-mono text-slate-400 truncate max-w-md">
                    {savedUrl}
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => fetchCalendar(savedUrl)}
                    disabled={loading}
                    className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 px-3 py-2 rounded transition"
                  >
                    {loading ? 'Mise à jour...' : 'Actualiser'}
                  </button>
                  <button
                    onClick={clearUrl}
                    className="text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-2 rounded transition"
                  >
                    Changer
                  </button>
                </div>
              </div>
            )}

            {error && (
              <div className="mt-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-xs rounded-lg">
                ⚠️ {error}
              </div>
            )}
          </div>

          {/* Affichage des engagements / VEVENTS */}
          {events.length > 0 && (
            <div className="space-y-4">
              <div className="flex items-center justify-between mb-2">
                <h2 className="text-lg font-semibold text-slate-200">
                  2. Engagements & Vols Détectés ({events.length})
                </h2>
                <span className="text-xs text-slate-400">
                  Prêt pour l'analyse de légalité FTL
                </span>
              </div>

              <div className="grid gap-3">
                {events.map((ev, idx) => (
                  <div
                    key={idx}
                    className="bg-slate-800/80 border border-slate-700 hover:border-slate-600 rounded-lg p-4 flex items-center justify-between transition"
                  >
                    <div>
                      <div className="font-semibold text-lime-400 font-mono text-base">
                        {ev.summary || 'Activité / Duty'}
                      </div>
                      <div className="text-xs text-slate-400 mt-1 flex items-center gap-4">
                        <span>
                          Début: {ev.start ? ev.start.toUTCString().slice(0, 22) : 'N/A'} UTC
                        </span>
                        <span>
                          Fin: {ev.end ? ev.end.toUTCString().slice(0, 22) : 'N/A'} UTC
                        </span>
                      </div>
                    </div>
                    <button className="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded font-medium transition">
                      Proposer au Swap
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {events.length === 0 && !loading && savedUrl && (
            <div className="text-center py-12 text-slate-500 text-sm">
              Aucun événement trouvé dans le fichier iCal.
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
