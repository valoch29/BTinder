<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTinder - airBaltic Roster Swap</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [icsUrl, setIcsUrl] = useState('');
      const [savedUrl, setSavedUrl] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [events, setEvents] = useState([]);
      const [trigram, setTrigram] = useState('');

      useEffect(() => {
        const storedUrl = localStorage.getItem('airbaltic_ics_url');
        if (storedUrl) {
          setIcsUrl(storedUrl);
          setSavedUrl(storedUrl);
          fetchCalendar(storedUrl);
        }
      }, []);

      const parseICS = (icsText) => {
        const parsedEvents = [];
        const lines = icsText.split(/\r\n|\n|\r/);
        let currentEvent = null;

        for (let line of lines) {
          if (line.startsWith('BEGIN:VEVENT')) {
            currentEvent = {};
          } else if (line.startsWith('END:VEVENT')) {
            if (currentEvent && currentEvent.summary) {
              parsedEvents.push(currentEvent);
            }
            currentEvent = null;
          } else if (currentEvent) {
            if (line.startsWith('SUMMARY:')) {
              currentEvent.summary = line.substring(8);
            } else if (line.startsWith('DTSTART')) {
              const val = line.split(':')[1];
              if (val) currentEvent.start = parseICSTime(val);
            } else if (line.startsWith('DTEND')) {
              const val = line.split(':')[1];
              if (val) currentEvent.end = parseICSTime(val);
            }
          }
        }
        return parsedEvents;
      };

      const parseICSTime = (cleanStr) => {
        try {
          const year = parseInt(cleanStr.substring(0, 4));
          const month = parseInt(cleanStr.substring(4, 6)) - 1;
          const day = parseInt(cleanStr.substring(6, 8));
          const hour = parseInt(cleanStr.substring(9, 11)) || 0;
          const min = parseInt(cleanStr.substring(11, 13)) || 0;
          return new Date(Date.UTC(year, month, day, hour, min));
        } catch (e) {
          return null;
        }
      };

      const fetchCalendar = async (urlToFetch) => {
        setLoading(true);
        setError(null);

        const matches = urlToFetch.match(/\/([A-Z]{3})\//);
        if (matches && matches[1]) {
          setTrigram(matches[1]);
        }

        try {
          // Utilisation d'un relais CORS plus rapide
          const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(urlToFetch)}`;
          const response = await fetch(proxyUrl);
          
          if (!response.ok) {
            throw new Error('Erreur de réponse du serveur.');
          }

          const icsData = await response.text();
          const parsed = parseICS(icsData);
          if (parsed.length === 0) {
            throw new Error('Aucun événement trouvé dans le fichier.');
          }
          setEvents(parsed);
          localStorage.setItem('airbaltic_ics_url', urlToFetch);
          setSavedUrl(urlToFetch);
        } catch (err) {
          setError('Erreur d\'accès direct. Vous pouvez aussi glisser le fichier .ics directement ci-dessous.');
        } finally {
          setLoading(false);
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const parsed = parseICS(event.target.result);
          setEvents(parsed);
          setError(null);
        };
        reader.readAsText(file);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (icsUrl) fetchCalendar(icsUrl);
      };

      const clearUrl = () => {
        localStorage.removeItem('airbaltic_ics_url');
        setSavedUrl('');
        setIcsUrl('');
        setEvents([]);
        setTrigram('');
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          <header className="flex items-center justify-between border-b border-slate-700 pb-6 mb-8">
            <div>
              <h1 className="text-2xl font-bold text-lime-400">✈️ BTinder - airBaltic Swap</h1>
              <p className="text-slate-400 text-sm mt-1">Saisie Roster & Assistant d'échange</p>
            </div>
            {trigram && (
              <span className="bg-lime-400/10 text-lime-400 border border-lime-400/30 px-3 py-1 rounded-full text-sm font-mono font-bold">
                Pilote : {trigram}
              </span>
            )}
          </header>

          <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-8 shadow-lg">
            <h2 className="text-lg font-semibold mb-3 text-slate-200">1. Option A: Lien Roster `who.airbaltic.com`</h2>
            
            <form onSubmit={handleSubmit} className="flex flex-col gap-3 mb-6">
              <input
                type="url"
                placeholder="https://who.airbaltic.com/api/v1/roster/calendar/download/FULL/..."
                value={icsUrl}
                onChange={(e) => setIcsUrl(e.target.value)}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-lime-400 font-mono text-slate-200"
              />
              <button
                type="submit"
                disabled={loading}
                className="bg-lime-400 hover:bg-lime-500 text-slate-950 font-semibold px-6 py-3 rounded-lg transition text-sm"
              >
                {loading ? 'Chargement en cours...' : 'Synchroniser via Lien'}
              </button>
            </form>

            <div className="border-t border-slate-700 pt-4">
              <h2 className="text-sm font-semibold mb-2 text-slate-300">Option B: Fichier .ics téléchargé</h2>
              <input 
                type="file" 
                accept=".ics"
                onChange={handleFileUpload}
                className="text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600"
              />
            </div>

            {error && (
              <div className="mt-4 p-3 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs rounded-lg">
                ⚠️ {error}
              </div>
            )}
          </div>

          {events.length > 0 && (
            <div className="space-y-4">
              <h2 className="text-lg font-semibold text-slate-200">
                2. Planning extrait ({events.length} activités)
              </h2>

              <div className="grid gap-3">
                {events.slice(0, 30).map((ev, idx) => (
                  <div key={idx} className="bg-slate-800 border border-slate-700 rounded-lg p-4 flex items-center justify-between">
                    <div>
                      <div className="font-semibold text-lime-400 font-mono text-base">{ev.summary}</div>
                      <div className="text-xs text-slate-400 mt-1">
                        {ev.start ? ev.start.toUTCString().slice(0, 22) : ''} UTC
                      </div>
                    </div>
                    <button className="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded">
                      Proposer
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
