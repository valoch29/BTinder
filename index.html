<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTinder - Submit Roster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-2xl space-y-6">
    
    <!-- Header Section -->
    <header class="text-center space-y-1">
      <div class="inline-flex items-center justify-center space-x-2">
        <span class="text-2xl">✈️</span>
        <h1 class="text-2xl font-bold tracking-tight text-white">BTinder</h1>
      </div>
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">airBaltic Crew Swap Assistant</p>
    </header>

    <!-- Roster Form -->
    <form id="rosterForm" class="space-y-4">
      
      <!-- Trigram Input -->
      <div>
        <label for="tri" class="block text-xs font-semibold text-slate-300 mb-1">Trigram</label>
        <input 
          id="tri" 
          type="text" 
          maxlength="3" 
          required 
          placeholder="WLH" 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm uppercase font-mono font-bold tracking-widest text-white focus:border-blue-500 focus:outline-none transition"
        />
      </div>

      <!-- Rank & Base Inputs -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="rank" class="block text-xs font-semibold text-slate-300 mb-1">Rank</label>
          <select id="rank" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-blue-500 focus:outline-none transition">
            <option value="FO">FO - First Officer</option>
            <option value="CPT">CPT - Captain</option>
          </select>
        </div>
        <div>
          <label for="base" class="block text-xs font-semibold text-slate-300 mb-1">Base</label>
          <input 
            id="base" 
            type="text" 
            required 
            placeholder="TLL" 
            value="TLL" 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm uppercase font-mono text-white focus:border-blue-500 focus:outline-none transition"
          />
        </div>
      </div>

      <!-- iCal URL Input -->
      <div>
        <label for="url" class="block text-xs font-semibold text-slate-300 mb-1">iCal URL</label>
        <input 
          id="url" 
          type="url" 
          required 
          placeholder="https://who.airbaltic.com/..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:border-blue-500 focus:outline-none transition"
        />
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        className="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold py-3 rounded-lg text-sm shadow-lg shadow-blue-600/20 transition duration-150 ease-in-out cursor-pointer"
        style="width: 100%;"
      >
        Submit Roster Link
      </button>

    </form>

    <!-- Simple Footer -->
    <footer class="text-center text-xs text-slate-500 pt-2 border-t border-slate-700/50">
      Submitting opens a pre-filled GitHub Issue for sync.
    </footer>

  </main>

  <script>
    document.getElementById('rosterForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const tri = document.getElementById('tri').value.toUpperCase().trim();
      const rank = document.getElementById('rank').value;
      const base = document.getElementById('base').value.toUpperCase().trim();
      const url = document.getElementById('url').value.trim();

      const title = encodeURIComponent(`[PILOT_REGISTRATION] ${tri}`);
      const body = encodeURIComponent(`Trigramme: ${tri}\nRang: ${rank}\nBase: ${base}\nURL: ${url}`);

      // Opens a pre-filled GitHub issue in a new tab
      window.open(`https://github.com/valoch29/BTinder/issues/new?title=${title}&body=${body}`, '_blank');
    });
  </script>

</body>
</html>
