<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTinder - airBaltic Roster</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 min-h-screen">
  <div class="max-w-4xl mx-auto">
    <header class="border-b border-slate-700 pb-4 mb-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-lime-400">✈️ BTinder</h1>
      <span className="text-xs bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-slate-400">
        Mode Simple (Direct ICS)
      </span>
    </header>

    <div id="app" class="space-y-6">
      <p class="text-slate-400 text-sm">Chargement des plannings en cours...</p>
    </div>
  </div>

  <script>
    // Extraction simplifiée des événements .ics
    function parseICS(icsText) {
      const events = [];
      const blocks = icsText.split("BEGIN:VEVENT");
      
      for (let i = 1; i < blocks.length; i++) {
        const block = blocks[i];
        const summary = (block.match(/SUMMARY:(.*)/) || [])[1] || "Activité";
        const dtstart = (block.match(/DTSTART:(.*)/) || [])[1] || "";
        const dtend = (block.match(/DTEND:(.*)/) || [])[1] || "";
        events.push({ summary: summary.trim(), dtstart: dtstart.trim(), dtend: dtend.trim() });
      }
      return events;
    }

    // Chargement principal
    async function init() {
      const app = document.getElementById("app");
      try {
        // 1. Charger data.json
        const resData = await fetch('./data.json');
        const pilots = await resData.json();

        app.innerHTML = ""; // Vider le loader

        // 2. Pour chaque pilote dans data.json, charger son fichier .ics
        for (const [id, pilot] of Object.entries(pilots)) {
          let eventsHtml = "";
          
          try {
            const resIcs = await fetch(pilot.url);
            const icsText = await resIcs.text();
            const events = parseICS(icsText);

            if (events.length === 0) {
              eventsHtml = `<p class="text-slate-500 text-sm">Aucun événement trouvé.</p>`;
            } else {
              eventsHtml = events.map(ev => `
                <div class="bg-slate-700/50 p-3 rounded border border-slate-600 flex justify-between items-center">
                  <span class="font-bold text-lime-400 font-mono">${ev.summary}</span>
                  <span class="text-xs text-slate-400">${ev.dtstart}</span>
                </div>
              `).join('');
            }
          } catch (err) {
            eventsHtml = `<p class="text-rose-400 text-sm">Erreur de téléchargement de l'URL iCal.</p>`;
          }

          // Affichage de la carte du pilote
          app.innerHTML += `
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-3">
              <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <div>
                  <h2 class="text-lg font-bold text-slate-100">${pilot.name} <span class="text-lime-400">(${id})</span></h2>
                  <p class="text-xs text-slate-400">${pilot.rank} • Base : ${pilot.base}</p>
                </div>
              </div>
              <div class="space-y-2">
                ${eventsHtml}
              </div>
            </div>
          `;
        }
      } catch (err) {
        app.innerHTML = `<div class="p-4 bg-rose-500/20 border border-rose-500 text-rose-300 rounded-xl">
          Impossible de charger <code>data.json</code>.
        </div>`;
      }
    }

    init();
  </script>
</body>
</html>
