<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTinder — Swap Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>BTinder</h1>
    <p class="subtitle">Assistant de swap simple & rapide</p>

    <div class="input-group">
      <label for="icalA">Mon lien iCal (AirBaltic)</label>
      <input type="url" id="icalA" placeholder="https://who.airbaltic.com/..." required>
    </div>

    <div class="input-group">
      <label for="icalB">Lien iCal du collègue</label>
      <input type="url" id="icalB" placeholder="https://who.airbaltic.com/..." required>
    </div>

    <button id="btnCompare">Vérifier l'échange</button>

    <div id="result" class="result-box hidden"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
