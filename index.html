<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTinder - airBaltic Swap Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [icsUrl, setIcsUrl] = useState('');
      const [rawText, setRawText] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [events, setEvents] = useState([]);
      const [trigram, setTrigram] = useState('');
      const [activeTab, setActiveTab] = useState('file'); // 'file', 'paste', 'url'

      // Analyse du format iCal (.ics)
      const parseICS = (icsText) => {
        const parsedEvents = [];
        const lines = icsText.split(/\r\n|\n|\r/);
        let currentEvent = null;

        for (let line of lines) {
          if (line.startsWith('BEGIN:VEVENT')) {
            currentEvent = {};
          } else if (line.startsWith('END:VEVENT')) {
            if (currentEvent && currentEvent.summary) {
              parsedEvents.push(currentEvent);
            }
            currentEvent = null;
          } else if (currentEvent) {
            if (line.startsWith('SUMMARY:')) {
              currentEvent.summary = line.substring(8);
            } else if (line.startsWith('DTSTART')) {
              const val = line.split(':')[1];
              if (val) currentEvent.start = parseICSTime(val);
            } else if (line.startsWith('DTEND')) {
              const val = line.split(':')[1];
              if (val) currentEvent.end = parseICSTime(val);
            }
          }
        }
        return parsedEvents;
      };

      const parseICSTime = (cleanStr) => {
        try {
          const year = parseInt(cleanStr.substring(0, 4));
          const month = parseInt(cleanStr.substring(4, 6)) - 1;
          const day = parseInt(cleanStr.substring(6, 8));
          const hour = parseInt(cleanStr.substring(9, 11)) || 0;
          const min = parseInt(cleanStr.substring(11, 13)) || 0;
          return new Date(Date.UTC(year, month, day, hour, min));
        } catch (e) {
          return null;
        }
      };

      // Traitement du fichier .ics local
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setError(null);
        const reader = new FileReader();
        reader.onload = (event) => {
          const parsed = parseICS(event.target.result);
          if (parsed.length === 0) {
            setError('Format de fichier invalide ou aucun événement trouvé.');
          } else {
            setEvents(parsed);
          }
        };
        reader.readAsText(file);
      };

      // Traitement du texte brut collé
      const handlePasteSubmit = (e) => {
        e.preventDefault();
        setError(null);
        if (!rawText.trim()) return;
        const parsed = parseICS(rawText);
        if (parsed.length === 0) {
          setError('Aucun événement VEVENT valide détecté dans le texte collé.');
        } else {
          setEvents(parsed);
        }
      };

      // Tentative via URL (avec gestion propre de l'erreur)
      const fetchCalendar = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError(null);

        const matches = icsUrl.match(/\/([A-Z]{3})\//);
        if (matches && matches[1]) {
          setTrigram(matches[1]);
        }

        try {
          const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(icsUrl)}`;
          const response = await fetch(proxyUrl);
          
          if (!response.ok) throw new Error('Erreur de réponse du serveur.');

          const icsData = await response.text();
          const parsed = parseICS(icsData);
          if (parsed.length === 0) throw new Error('Contenu vide.');
          setEvents(parsed);
        } catch (err) {
          setError('Blocage réseau (CORS) par le serveur airBaltic. Utilisez l\'onglet "Fichier .ics" ou "Copier/Coller" ci-dessus pour importer votre planning instantanément.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          {/* En-tête */}
          <header className="flex items-center justify-between border-b border-slate-700 pb-6 mb-8">
            <div>
              <h1 className="text-2xl font-bold text-lime-400">✈️ BTinder - airBaltic Swap</h1>
              <p className="text-slate-400 text-sm mt-1">Assistant de vérification FTL & d'échange de plannings</p>
            </div>
            <span className="bg-lime-400/10 text-lime-400 border border-lime-400/30 px-3 py-1 rounded-full text-sm font-mono font-bold">
              Pilote : {trigram || 'WLH'}
            </span>
          </header>

          {/* Importation du Roster */}
          <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-8 shadow-lg">
            <h2 className="text-lg font-semibold mb-4 text-slate-200">1. Importer votre planning Roster</h2>
            
            {/* Onglets de choix */}
            <div className="flex border-b border-slate-700 mb-6 gap-2">
              <button
                onClick={() => setActiveTab('file')}
                className={`pb-3 px-4 text-sm font-medium border-b-2 transition ${
                  activeTab === 'file'
                    ? 'border-lime-400 text-lime-400'
                    : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                📁 Fichier .ics (Recommandé)
              </button>
              <button
                onClick={() => setActiveTab('paste')}
                className={`pb-3 px-4 text-sm font-medium border-b-2 transition ${
                  activeTab === 'paste'
                    ? 'border-lime-400 text-lime-400'
                    : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                📋 Copier / Coller Texte
              </button>
              <button
                onClick={() => setActiveTab('url')}
                className={`pb-3 px-4 text-sm font-medium border-b-2 transition ${
                  activeTab === 'url'
                    ? 'border-lime-400 text-lime-400'
                    : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                🔗 Lien URL Sync
              </button>
            </div>

            {/* Contenu Onglet 1 : Fichier Local */}
            {activeTab === 'file' && (
              <div>
                <p className="text-xs text-slate-400 mb-3">
                  Téléchargez votre fichier `.ics` depuis `who.airbaltic.com` et déposez-le ici :
                </p>
                <input 
                  type="file" 
                  accept=".ics"
                  onChange={handleFileUpload}
                  className="w-full text-sm text-slate-400 file:mr-4 file:py-3 file:px-6 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-lime-400 file:text-slate-950 hover:file:bg-lime-500 cursor-pointer bg-slate-900 p-2 rounded-lg border border-slate-700"
                />
              </div>
            )}

            {/* Contenu Onglet 2 : Copier-Coller */}
            {activeTab === 'paste' && (
              <form onSubmit={handlePasteSubmit} className="flex flex-col gap-3">
                <textarea
                  rows="5"
                  placeholder="Collez le contenu texte de votre fichier .ics ici (BEGIN:VCALENDAR...)"
                  value={rawText}
                  onChange={(e) => setRawText(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs focus:outline-none focus:border-lime-400 font-mono text-slate-200"
                ></textarea>
                <button
                  type="submit"
                  className="bg-lime-400 hover:bg-lime-500 text-slate-950 font-semibold px-6 py-2.5 rounded-lg transition text-sm self-start"
                >
                  Charger le texte
                </button>
              </form>
            )}

            {/* Contenu Onglet 3 : URL directe */}
            {activeTab === 'url' && (
              <form onSubmit={fetchCalendar} className="flex flex-col gap-3">
                <input
                  type="url"
                  placeholder="https://who.airbaltic.com/api/v1/roster/calendar/download/FULL/..."
                  value={icsUrl}
                  onChange={(e) => setIcsUrl(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-lime-400 font-mono text-slate-200"
                />
                <button
                  type="submit"
                  disabled={loading}
                  className="bg-lime-400 hover:bg-lime-500 text-slate-950 font-semibold px-6 py-3 rounded-lg transition text-sm self-start"
                >
                  {loading ? 'Tentative en cours...' : 'Synchroniser via Lien'}
                </button>
              </form>
            )}

            {/* Message d'erreur explicatif */}
            {error && (
              <div className="mt-4 p-3 bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs rounded-lg leading-relaxed">
                ⚠️ {error}
              </div>
            )}
          </div>

          {/* Liste des vols extraits */}
          {events.length > 0 && (
            <div className="space-y-4">
              <div className="flex items-center justify-between">
                <h2 className="text-lg font-semibold text-slate-200">
                  2. Activités extraites ({events.length})
                </h2>
                <span className="text-xs bg-lime-400/10 text-lime-400 px-3 py-1 rounded-full border border-lime-400/20">
                  Planning chargé avec succès
                </span>
              </div>

              <div className="grid gap-3 max-h-[500px] overflow-y-auto pr-2">
                {events.map((ev, idx) => (
                  <div key={idx} className="bg-slate-800 border border-slate-700 rounded-lg p-4 flex items-center justify-between hover:border-slate-600 transition">
                    <div>
                      <div className="font-semibold text-lime-400 font-mono text-base">{ev.summary}</div>
                      <div className="text-xs text-slate-400 mt-1 flex gap-4">
                        <span>Début : {ev.start ? ev.start.toUTCString().slice(0, 22) : 'N/A'} UTC</span>
                        <span>Fin : {ev.end ? ev.end.toUTCString().slice(0, 22) : 'N/A'} UTC</span>
                      </div>
                    </div>
                    <button className="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded transition">
                      Proposer au Swap
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
